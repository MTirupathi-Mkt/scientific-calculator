<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="app">

    <div class="calculator">

        <div class="top-bar">

            <h1>Scientific Calculator</h1>

            <button id="themeButton"
                    onclick="toggleTheme()">
                🌙
            </button>

        </div>


        <div class="mode-row">

            <button id="angleButton"
                    onclick="toggleAngleMode()">
                DEG
            </button>

            <span id="angleText">
                Degrees
            </span>

        </div>


        <input
            type="text"
            id="display"
            placeholder="0"
            readonly
        >


        <!-- Scientific buttons -->

        <div class="scientific-buttons">

            <button onclick="scientific('sin')">
                sin
            </button>

            <button onclick="scientific('cos')">
                cos
            </button>

            <button onclick="scientific('tan')">
                tan
            </button>

            <button onclick="scientific('sqrt')">
                √
            </button>

            <button onclick="scientific('square')">
                x²
            </button>

            <button onclick="scientific('power')">
                xʸ
            </button>

            <button onclick="scientific('log')">
                log
            </button>

            <button onclick="scientific('ln')">
                ln
            </button>

            <button onclick="addConstant('pi')">
                π
            </button>

            <button onclick="addConstant('e')">
                e
            </button>

            <button onclick="addNumber('(')">
                (
            </button>

            <button onclick="addNumber(')')">
                )
            </button>

        </div>


        <!-- Normal buttons -->

        <div class="buttons">

            <button onclick="clearDisplay()"
                    class="special">
                C
            </button>

            <button onclick="deleteLast()"
                    class="special">
                ⌫
            </button>

            <button onclick="percentage()"
                    class="special">
                %
            </button>

            <button onclick="addOperator('/')"
                    class="operator">
                ÷
            </button>


            <button onclick="addNumber('7')">
                7
            </button>

            <button onclick="addNumber('8')">
                8
            </button>

            <button onclick="addNumber('9')">
                9
            </button>

            <button onclick="addOperator('*')"
                    class="operator">
                ×
            </button>


            <button onclick="addNumber('4')">
                4
            </button>

            <button onclick="addNumber('5')">
                5
            </button>

            <button onclick="addNumber('6')">
                6
            </button>

            <button onclick="addOperator('-')"
                    class="operator">
                −
            </button>


            <button onclick="addNumber('1')">
                1
            </button>

            <button onclick="addNumber('2')">
                2
            </button>

            <button onclick="addNumber('3')">
                3
            </button>

            <button onclick="addOperator('+')"
                    class="operator">
                +
            </button>


            <button onclick="addNumber('0')"
                    class="zero">
                0
            </button>

            <button onclick="addNumber('.')">
                .
            </button>

            <button onclick="calculate()"
                    class="equal">
                =
            </button>

        </div>

    </div>


    <!-- History -->

    <div class="history">

        <h2>Calculation History</h2>

        <button
            onclick="clearHistory()"
            class="clear-history">

            Clear History

        </button>

        <div id="historyList">

            <p class="empty">
                No calculations yet
            </p>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
